<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>记单词 · 我的单词本</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1 class="logo">📖 记单词</h1>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-view="study">学习</button>
        <button class="tab" data-view="quiz">测验</button>
        <button class="tab" data-view="bank">词库</button>
        <button class="tab" data-view="stats">统计</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- ============ 学习视图 ============ -->
    <section id="view-study" class="view active">
      <div class="study-top">
        <div class="goal-wrap">
          <span class="goal-label">今日进度</span>
          <div class="progress-track"><div class="progress-fill" id="studyProgressFill" style="width:0%"></div></div>
          <span class="goal-text" id="studyProgressText">0 / 20</span>
        </div>
        <button class="btn btn-ghost" id="btnPlanSettings">🎯 目标</button>
      </div>

      <div id="studyCardArea" class="study-card-area">
        <!-- 卡片由 JS 渲染 -->
      </div>
    </section>

    <!-- ============ 测验视图 ============ -->
    <section id="view-quiz" class="view">
      <div class="panel" id="quizSetup">
        <h2 class="panel-title">开始测验</h2>
        <div class="form-group">
          <label>题型</label>
          <div class="seg" id="quizTypeSeg">
            <button class="seg-btn active" data-type="en2zh">看英文选中文</button>
            <button class="seg-btn" data-type="zh2en">看中文选英文</button>
            <button class="seg-btn" data-type="spell">拼写</button>
          </div>
        </div>
        <div class="form-group">
          <label>出题范围</label>
          <div class="seg" id="quizScopeSeg">
            <button class="seg-btn active" data-scope="all">全部单词</button>
            <button class="seg-btn" data-scope="wrong">我的生词</button>
          </div>
        </div>
        <div class="form-group">
          <label>题数</label>
          <select id="quizCount" class="input">
            <option value="10">10 题</option>
            <option value="20">20 题</option>
            <option value="30" selected>30 题</option>
            <option value="50">50 题</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btnStartQuiz">开始测验</button>
      </div>

      <div class="panel hidden" id="quizPanel">
        <div class="quiz-head">
          <span id="quizIndex">第 1 / 30 题</span>
          <span class="quiz-score" id="quizScore">✅ 0</span>
        </div>
        <div id="quizBody"></div>
      </div>

      <div class="panel hidden" id="quizResult">
        <h2 class="panel-title">测验结果</h2>
        <div class="result-big" id="quizResultScore">0 / 0</div>
        <div class="result-detail" id="quizResultDetail"></div>
        <div class="result-actions">
          <button class="btn btn-primary" id="btnQuizAgain">再测一次</button>
          <button class="btn btn-ghost" id="btnQuizReview">复习错题</button>
        </div>
      </div>
    </section>

    <!-- ============ 词库视图 ============ -->
    <section id="view-bank" class="view">
      <div class="bank-toolbar">
        <input class="input search" id="bankSearch" placeholder="搜索单词或释义…" />
        <select class="input" id="bankCategory">
          <option value="">全部分类</option>
        </select>
      </div>
      <div class="panel">
        <div class="bank-list-head">
          <span class="bank-strong">单词列表</span>
          <span id="bankCount" class="bank-count">0 个单词</span>
        </div>
        <ul id="bankList" class="bank-list"></ul>
      </div>
      <div class="panel">
        <h2 class="panel-title">添加单词</h2>
        <div class="add-grid">
          <input class="input" id="addWord" placeholder="单词 *" />
          <input class="input" id="addPhonetic" placeholder="音标（可选）" />
          <input class="input" id="addMeaning" placeholder="释义，如：v. 放弃 *" />
          <input class="input" id="addExample" placeholder="例句（可选）" />
          <input class="input" id="addCategory" placeholder="分类（可选，默认：自定义）" />
        </div>
        <button class="btn btn-primary" id="btnAddWord">＋ 添加到词库</button>
      </div>
    </section>

    <!-- ============ 统计视图 ============ -->
    <section id="view-stats" class="view">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">总词数</div></div>
        <div class="stat-card"><div class="stat-num" id="statKnown">0</div><div class="stat-label">已掌握</div></div>
        <div class="stat-card"><div class="stat-num" id="statLearning">0</div><div class="stat-label">学习中</div></div>
        <div class="stat-card"><div class="stat-num" id="statNew">0</div><div class="stat-label">未学</div></div>
      </div>
      <div class="panel">
        <h2 class="panel-title">正确率</h2>
        <div class="progress-track big"><div class="progress-fill" id="statAccuracyFill" style="width:0%"></div></div>
        <div class="stat-sub" id="statAccuracyText">暂无数据</div>
        <div class="stat-sub" id="statStreak">🔥 连续学习 0 天</div>
      </div>
      <div class="panel">
        <h2 class="panel-title">生词本（<span id="wrongCount">0</span>）</h2>
        <ul id="wrongList" class="wrong-list"></ul>
      </div>
      <div class="panel">
        <h2 class="panel-title">数据管理</h2>
        <p class="tip">进度保存在本浏览器（localStorage），清空缓存会丢失。可导出备份。</p>
        <div class="row">
          <button class="btn btn-ghost" id="btnExport">导出备份</button>
          <button class="btn btn-ghost" id="btnImport" >导入备份</button>
          <button class="btn btn-danger" id="btnReset">重置进度</button>
        </div>
        <input type="file" id="importFile" accept=".json" class="hidden" />
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
